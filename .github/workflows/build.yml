name: Android quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pin the current GA LTS runner. The runner OS is isolated from the build inputs: the
    # JDK and command-line-tools archives are self-provisioned and SHA-256-verified, and the
    # SDK packages are revision-checked, so this is a soft pin; revisit when 24.04 is
    # deprecated or 26.04 is GA. `ubuntu-latest` would silently roll to preview 26.04 in
    # Oct-Nov 2026 (runner-images#14226).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      # Ubuntu runners predefine this legacy alias; keep it consistent with ANDROID_HOME.
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv runs the pinned Ruff and ty below. It installs nothing into the project, and the scripts
      # import only the standard library, so there is no dependency set to resolve or lock.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - name: Check host scripts
        run: |
          set -euo pipefail
          uvx --from ruff==0.16.10 ruff check --output-format=github scripts
          uvx --from ruff==0.16.10 ruff format --check --output-format=github scripts
          uvx --from ty==0.0.84 ty check --output-format=github scripts
      - name: Test host device harnesses
        run: python3 -I -m unittest discover -s scripts -p 'test_*.py' -v
      # JDK 21 is the tested LTS pin. It only runs Gradle -- the APK targets Java 17 bytecode --
      # so newer releases buy nothing downstream: 25 is untested by detekt's documented toolchain,
      # 27 requires Gradle 9.8.0 (this pins 9.6.1), and 26 is a non-LTS feature release.
      - name: Install pinned Temurin JDK
        run: |
          set -euo pipefail
          archive=OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz
          curl --fail --location --silent --show-error \
            "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/$archive" \
            -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' \
            ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94 \
            "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk-21.0.12.1+1" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jdk-21.0.12.1+1/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install pinned Android SDK
        run: scripts/setup-android-sdk.sh
      - name: Record source and toolchain
        run: |
          set -euo pipefail
          mkdir -p build/reports
          {
            git rev-parse HEAD
            java -version 2>&1
            ./gradlew --version
            ./gradlew :app:dependencies --configuration kotlinCompilerClasspath
            ./gradlew :app:dependencies --configuration detektPlugins
            cat "$ANDROID_HOME/platforms/android-37.0/source.properties"
            cat "$ANDROID_HOME/build-tools/36.0.0/source.properties"
            cat "$ANDROID_HOME/platform-tools/source.properties"
          } | tee build/reports/toolchain.txt
      - name: Check and build
        run: ./gradlew qualityGate :app:assembleDebug
      - name: Verify debug APK
        run: scripts/verify-apk.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/reports/apk-*
            build/reports/toolchain.txt
          if-no-files-found: error
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-reports-${{ github.sha }}
          path: |
            build/reports/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
