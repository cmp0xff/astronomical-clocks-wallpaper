# Local convenience hooks; CI stays authoritative and runs the same pinned tools from uv.lock.
# Hook revisions must match `[dependency-groups].dev` in pyproject.toml (checked in CI); ty's
# `--isolated` keeps pre-commit from mutating `.venv` or `uv.lock` during hook runs.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        files: ^scripts/
      - id: ruff-format
        files: ^scripts/
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    hooks:
      - id: ty
        args: [--isolated]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
