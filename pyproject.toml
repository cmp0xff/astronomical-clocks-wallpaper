# Host tooling for scripts/*.py only. The Gradle build does not read this file, nothing here reaches
# the APK, and the Android quality gate stays hermetic and independent of it.
#
# The scripts import nothing outside the standard library, so there is no dependency set to resolve
# or lock and no lockfile here. CI runs Ruff and ty from the exact versions pinned in
# .github/workflows/build.yml, which are recorded in docs/dependencies.md.

[tool.ruff]
line-length = 120
src = ["scripts"]
# Python 3.12 is the interpreter the CI runner's `python3` resolves to, and nothing in scripts/
# uses syntax newer than it. A newer target with an older runtime would be incoherent.
target-version = "py312"
# Stable rules only. A preview rule may change meaning between patch releases, and CI pins an exact
# Ruff version, so the result has to stay portable across the patch releases of that pin.
preview = false

[tool.ruff.lint]
select = ["ALL"]
# Only the rules Ruff's formatter conflicts with, plus D212, which conflicts with the D213 layout
# already in use. Recorded with reasons in docs/development.md#rule-exceptions. No rule has its
# severity lowered and no directory is excluded.
ignore = [
  "W191", # tab indentation would be reformatted
  "E111", # indentation is not a multiple of four
  "E114", # indentation is not a multiple of four (comment)
  "E117", # over-indented
  "D203", # one blank line before class docstring; conflicts with D211
  "D206", # docstring indentation; the formatter owns it
  "D300", # triple double quotes; the formatter owns it
  "Q000", # bad quotes for inline strings
  "Q001", # bad quotes for multiline strings
  "Q002", # bad quotes for docstrings
  "Q003", # avoidable escaped quote
  "Q004", # unnecessary escaped quote
  "COM812", # missing trailing comma
  "COM819", # prohibited trailing comma
  "D212", # multi-line summary first line; conflicts with the D213 layout in use
]

[tool.ruff.lint.flake8-copyright]
# The repository marks licensing with an SPDX identifier rather than a copyright line: the Kotlin
# sources, the shell scripts, and these Python files all carry the same form.
notice-rgx = "# SPDX-License-Identifier: Apache-2\\.0"

[tool.ruff.lint.per-file-ignores]
# Both harnesses print their report to stdout; T201 has no third-party logger to convert to, and the
# report is the deliverable. scripts/ is deliberately not an importable package, which is what
# INP001 asks for.
"scripts/device_qualification.py" = ["T201", "INP001"]
"scripts/device_smoke_test.py" = ["T201", "INP001"]
# The split test modules are not packages either; their methods are described by their docstrings
# and names rather than a per-method summary line. The PT rules are flake8-pytest-style, and this
# suite is stdlib `unittest` by design, because host tooling may not add a dependency and pytest is
# a dependency: PT009 and PT027 want unittest assertions replaced with bare `assert`/pytest.raises,
# and PT019 reads the `unittest.mock.patch` parameters that are injected positionally as fixtures.
"scripts/test_device_smoke.py" = ["INP001", "D102", "D103", "PT009", "PT019", "PT027"]
"scripts/test_device_qualification.py" = ["INP001", "D102", "D103", "PT009", "PT019", "PT027"]

# The shared test-only RGBA fixture helper is also a standalone scripts/ module.
"scripts/device_test_fixtures.py" = ["INP001"]

[tool.ty.rules]
# ty has no `strict` preset or `--strict` flag, so promoting every rule to an error is how strictness
# is expressed here; `terminal.error-on-warning` then makes a warning fail the run as well.
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
# Matches Ruff's target-version and the CI runner's python3.
python-version = "3.12"
