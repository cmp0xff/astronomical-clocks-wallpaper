# Host tooling. The Gradle build does not read this file, nothing here reaches the APK, and the
# Android quality gate and release workflow stay hermetic and independent of uv and the locked
# development environment; their verification scripts use only the system python3 standard library.
#
# Runtime harnesses in scripts/ remain standard-library only (`dependencies = []`,
# `[tool.uv] package = false`). Host test and static-analysis tools are pinned in
# `[dependency-groups].dev` and locked in `uv.lock`; CI and local workflows reproduce the
# environment with `uv sync --frozen --group dev`. Provenance is recorded in docs/dependencies.md.

[project]
name = "astronomical-clocks-wallpaper-host"
version = "0.0.0"
description = "Host-only ADB verification and qualification harnesses for Astronomical Clock Wallpaper"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "codespell==2.4.3",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-mock==3.17.0",
  "pytest-subtests==0.15.0",
  "ruff==0.16.10",
  "ty==0.0.84",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
src = ["scripts"]
# Python 3.12 is the interpreter the CI runner's `python3` resolves to, and nothing in scripts/
# uses syntax newer than it. A newer target with an older runtime would be incoherent.
target-version = "py312"
# Stable rules only. A preview rule may change meaning between patch releases, and CI pins an exact
# Ruff version, so the result has to stay portable across the patch releases of that pin.
preview = false

[tool.ruff.lint]
select = ["ALL"]
# Only four rules are relaxed after the 2026-10-07 audit against the pinned toolchain: every other
# rule on Ruff's documented formatter-conflict list
# (https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules) runs clean on formatter-stable
# output. Reasons, examples, and the audit method: docs/development.md#rule-exceptions.
ignore = [
  "D203",   # one blank line before a class docstring; conflicts with enabled D211
  "D212",   # multi-line summary on the first line; conflicts with the D213 layout in use
  "D300",   # formatter preserves triple-single-quoted docstrings to avoid escapes
  "COM812", # formatter omits trailing commas in compact multi-line constructs; Ruff warns
]

[tool.ruff.lint.flake8-copyright]
# The repository marks licensing with an SPDX identifier rather than a copyright line: the Kotlin
# sources, the shell scripts, and these Python files all carry the same form.
notice-rgx = "# SPDX-License-Identifier: Apache-2\\.0"

[tool.ruff.lint.per-file-ignores]
# Both harnesses print their report to stdout; T201 has no third-party logger to convert to, and the
# report is the deliverable. scripts/ is deliberately not an importable package, which is what
# INP001 asks for.
"scripts/battery_protocol.py" = ["T201", "INP001"]
"scripts/battery_report.py" = ["T201", "INP001"]
"scripts/device_layer.py" = ["T201", "INP001"]
"scripts/device_qualification.py" = ["T201", "INP001"]
"scripts/device_smoke.py" = ["T201", "INP001"]
# The split test modules are not packages either; their methods are described by their docstrings
# and names rather than a per-method summary line. The PT rules are flake8-pytest-style: while these
# existing unittest.TestCase modules await the #148 migration, PT009 and PT027 flag
# assertEqual/assertRaises and PT019 reads positionally injected unittest.mock.patch parameters as
# pytest fixtures.
"scripts/test_battery_protocol.py" = ["INP001", "D102", "D103", "PT009", "PT019", "PT027"]
"scripts/test_battery_report.py" = ["INP001", "D102", "D103", "PT009", "PT019", "PT027"]
"scripts/test_device_smoke.py" = ["INP001", "D102", "D103", "PT009", "PT019", "PT027"]
"scripts/test_device_qualification.py" = ["INP001", "D102", "D103", "PT009", "PT019", "PT027"]

# The shared test-only RGBA fixture helper is also a standalone scripts/ module.
"scripts/device_test_fixtures.py" = ["INP001"]

# The host tooling checker is dev tooling run as a script, and its tests follow the same unittest
# conventions as the modules above until the #148 migration.
"scripts/check_host_tooling.py" = ["INP001"]
"scripts/test_check_host_tooling.py" = ["INP001", "D102", "D103", "PT009", "PT019", "PT027"]

[tool.codespell]
# Domain vocabulary and local identifiers that codespell's dictionary flags; see the 2026-10-07
# scan in docs/development.md. `skip` keeps direct local runs off generated output and `.venv`.
ignore-words-list = "precesses,Nome,positionOf,IST"
skip = "build,app/build,.gradle,.kotlin,.ruff_cache,.venv,.pytest_cache,htmlcov"

[tool.ty.rules]
# ty has no `strict` preset or `--strict` flag, so promoting every rule to an error is how strictness
# is expressed here; `terminal.error-on-warning` then makes a warning fail the run as well.
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
# Matches Ruff's target-version and the CI runner's python3.
python-version = "3.12"
